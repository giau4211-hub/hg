name: Auto Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Source
        run: |
          unzip -o app_source.zip
          # Di chuyen neu sau khi giai nen bi long them thu muc
          find . -maxdepth 3 -name "build.gradle.kts"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          TARGET_DIR=$(find . -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
          echo "Found build dir at: $TARGET_DIR"
          cd "$TARGET_DIR"
          chmod +x gradlew 2>/dev/null || true
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: efootball-bot-apk
          path: "**/build/outputs/apk/debug/*.apk"
